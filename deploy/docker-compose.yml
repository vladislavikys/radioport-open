services:
  radioport:
    image: nginx:1.27-alpine
    container_name: radioport
    restart: unless-stopped
    ports:
      - "8090:80"
    volumes:
      - /srv/radioport:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    mem_limit: 128m
    cpus: 1
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options: { max-size: "5m", max-file: "2" }
