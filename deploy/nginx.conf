server {
    listen 80 default_server;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header X-Frame-Options DENY always;

    # app shell: always revalidate, so updates land at once
    location / {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header X-Frame-Options DENY always;
        try_files $uri $uri/ =404;
    }

    location = /manifest.webmanifest {
        default_type application/manifest+json;
        add_header Cache-Control "no-cache";
        add_header X-Robots-Tag "noindex, nofollow" always;
    }

    # music: big, never changes; Range requests are native in nginx
    location /audio/ {
        add_header Cache-Control "public, max-age=2592000, immutable";
        add_header X-Content-Type-Options nosniff always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header Accept-Ranges bytes;
        tcp_nodelay on;
        sendfile on;
    }

    location ~* \.(png|ttf)$ {
        add_header Cache-Control "public, max-age=2592000";
        add_header X-Robots-Tag "noindex, nofollow" always;
    }

    gzip on;
    gzip_types text/css application/javascript application/json application/manifest+json image/svg+xml;
    gzip_min_length 1024;
}
